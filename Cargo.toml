[package]
name = "csv_polars_cleaner"
authors = ["Sanjay Singh <sanjaysingh13@gmail.com>"]
version = "0.3.0"
edition = "2024"
description = "A robust Rust library for extracting and cleaning tabular data from messy CSV files using Polars."
license = "MIT OR Apache-2.0"
repository = "https://github.com/sanjaysingh13/csv_polars_cleaner"
documentation = "https://docs.rs/csv_polars_cleaner"
homepage = "https://github.com/sanjaysingh13/csv_polars_cleaner"
readme = "README.md"
[dependencies]
polars = { version = "0.46.0" }
anyhow = "1.0"
glob = "0.3"          # For folder pattern matching
serde = { version = "1.0", features = ["derive"] }
csv = "1.3"           # Optional: raw CSV reading
rayon = "1.10"         # Optional: parallel folder processing
log = "0.4"           # Optional: diagnostics
walkdir = "2.4"
